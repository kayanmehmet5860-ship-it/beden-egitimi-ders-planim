<script>
(function(){
const KEY="bedenEgPlan_v3";
let saved={};
try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){saved={}}
function saveAll(){localStorage.setItem(KEY,JSON.stringify(saved))}
function itemKey(g,w){return g+"__"+w}
window.detail=function(d){
 hide();
 document.getElementById("detail").classList.remove("hidden");
 const k=itemKey(current,d.week), s=saved[k]||{};
 const topic=s.topic??d.topic, outcome=s.outcome??d.outcome, plan=s.plan??d.plan;
 const done=!!s.done;
 document.getElementById("detailBox").innerHTML=
 `<h2>${current} · ${d.week}. Hafta</h2>
 <div class="card">
 <div class="label">Tema</div><div class="value">🎯 ${d.theme}</div>
 <div class="label">Öğrenme çıktısı kodu</div><div class="value">${d.code}</div>
 <div class="editor">
 <div class="label">Konu</div><input id="edTopic" value="${esc(topic)}">
 <div class="label">Kazanım / öğrenme çıktısı</div><textarea id="edOutcome">${esc(outcome)}</textarea>
 <div class="label">Ders işleyişi</div><textarea id="edPlan">${esc(plan)}</textarea>
 <div class="label">Süre</div><input id="edDuration" value="${esc(s.duration||d.duration)}">
 <button class="save" onclick="saveWeek(${d.week})">💾 Kaydet</button>
 </div>
 <button class="${done?'done ':''}check" id="doneBtn" onclick="toggleDone(${d.week})">${done?'✅ Ders işlendi':'☑ Dersi İşledim'}</button>
 <button class="reset" onclick="resetWeek(${d.week})">↺ Bu haftayı varsayılana döndür</button>
 </div>`;
}
window.saveWeek=function(w){
 const k=itemKey(current,w);
 saved[k]={...(saved[k]||{}),topic:document.getElementById("edTopic").value,
 outcome:document.getElementById("edOutcome").value,plan:document.getElementById("edPlan").value,
 duration:document.getElementById("edDuration").value,done:!!(saved[k]&&saved[k].done)};
 saveAll(); alert("Hafta kaydedildi."); showWeeks(current);
}
window.toggleDone=function(w){
 const k=itemKey(current,w); saved[k]={...(saved[k]||{}),done:!(saved[k]&&saved[k].done)}; saveAll(); detail(DATA[current][w-1]);
}
window.resetWeek=function(w){
 const k=itemKey(current,w); delete saved[k]; saveAll(); detail(DATA[current][w-1]);
}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
})();
</script>
